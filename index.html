<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참이슬 KOSPI/S&P 지수 트래커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .chart-box { height: 280px; position: relative; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 flex items-center gap-2">
          <i class="fas fa-chart-line text-indigo-600"></i>
          참이슬 KOSPI/S&P 지수
        </h1>
        <p class="text-slate-500 font-medium">내 컴퓨터에 안전하게 저장되는 단독형 주식 지수 웹앱</p>
      </div>

      <!-- Auth Panel -->
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <!-- Backup & Restore Buttons (Every user can access) -->
        <button onclick="exportData()" class="bg-white border text-slate-700 px-3 py-2 rounded-lg hover:bg-slate-50 text-sm font-semibold transition flex items-center gap-1 shadow-sm">
          <i class="fas fa-download"></i> 백업 백업(다운로드)
        </button>
        <label class="bg-white border text-slate-700 px-3 py-2 rounded-lg hover:bg-slate-50 text-sm font-semibold transition flex items-center gap-1 shadow-sm cursor-pointer">
          <i class="fas fa-upload"></i> 복구(가져오기)
          <input type="file" id="import-file" class="hidden" onchange="importData(event)">
        </label>

        <!-- Admin Input -->
        <div id="auth-section" class="flex gap-2 flex-grow md:flex-none">
          <input type="password" id="admin-pass" placeholder="학생 비밀번호" class="flex-grow md:flex-none px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm shadow-sm">
          <button onclick="checkAuth()" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 text-sm font-semibold transition whitespace-nowrap shadow-md">
            관리자 인증
          </button>
        </div>
        
        <!-- Admin Logged In -->
        <div id="admin-badge" class="hidden flex items-center gap-2 bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg border border-indigo-200 shadow-sm">
          <i class="fas fa-user-shield"></i>
          <span class="font-bold text-sm">학생 권한 모드</span>
          <button onclick="logout()" class="text-xs underline ml-2 opacity-70 hover:opacity-100">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <!-- Main Charts Section -->
      <div class="lg:col-span-3 space-y-8">
        <!-- KOSPI Chart Box -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2 text-blue-700">
              <span class="w-2 h-6 bg-blue-500 rounded-full"></span>
              KOSPI 지수 그래프
            </h2>
          </div>
          <div class="chart-box">
            <canvas id="kospiChart"></canvas>
          </div>
        </div>

        <!-- S&P 500 Chart Box -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2 text-red-700">
              <span class="w-2 h-6 bg-red-500 rounded-full"></span>
              S&P 500 지수 그래프
            </h2>
            <div class="text-xs text-slate-400 font-medium">로컬 브라우저 저장소 연동</div>
          </div>
          <div class="chart-box">
            <canvas id="snpChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Control & History Section -->
      <div class="space-y-6">
        <!-- Input Panel (Admin Only) -->
        <div id="input-panel" class="hidden bg-white p-6 rounded-2xl shadow-lg border-t-4 border-indigo-600 animate-in fade-in duration-300">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-pen-fancy text-indigo-500"></i>
            지수 데이터 입력
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">기록 날짜</label>
              <input type="date" id="input-date" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-medium text-sm">
            </div>
            <div class="space-y-3">
              <div>
                <label class="block text-[10px] font-bold text-blue-500 mb-1 uppercase">KOSPI 지수</label>
                <input type="number" id="input-kospi" step="0.01" placeholder="0000.00" class="w-full p-2.5 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-red-500 mb-1 uppercase">S&P 500 지수</label>
                <input type="number" id="input-snp" step="0.01" placeholder="0000.00" class="w-full p-2.5 border border-red-100 rounded-lg focus:ring-2 focus:ring-red-500 outline-none text-sm">
              </div>
            </div>
            <button onclick="submitData()" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition transform active:scale-95 shadow-lg shadow-indigo-100 text-sm">
              오늘의 데이터 저장
            </button>
          </div>
        </div>

        <!-- Recent History -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-4 border-b bg-slate-50 flex items-center gap-2 font-bold text-sm text-slate-600">
            <i class="fas fa-list-ol"></i> 입력 기록
          </div>
          <div id="history-list" class="max-h-[250px] overflow-y-auto divide-y divide-slate-100">
            <div class="p-8 text-center text-slate-400 text-sm">기록이 없습니다.</div>
          </div>
          <div class="p-2.5 bg-slate-50 text-[10px] text-center text-slate-400 font-medium">
            지수를 클릭하면 하단 계산기에 자동 입력됩니다.
          </div>
        </div>

        <!-- Profit Calculator -->
        <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-emerald-500">
          <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-700">
            <i class="fas fa-coins text-emerald-500"></i>
            상세 수익 계산기
          </h3>
          <div class="space-y-3">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">투자한 금액 (이슬)</label>
              <input type="number" id="calc-amount" placeholder="예: 1,000,000" oninput="calculateProfit()" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-slate-700">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">살 때 지수</label>
                <input type="number" id="calc-buy" step="0.01" placeholder="0000.00" oninput="calculateProfit()" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">팔 때 지수</label>
                <input type="number" id="calc-sell" step="0.01" placeholder="0000.00" oninput="calculateProfit()" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
              </div>
            </div>
            
            <!-- Result Display Card -->
            <div id="calc-result" class="mt-4 p-4 rounded-xl bg-slate-900 text-white hidden space-y-3 transition-all">
              <div class="flex justify-between items-end border-b border-slate-700 pb-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase">예상 수익률</span>
                <span id="result-percent" class="text-xl font-black">0%</span>
              </div>
              <div class="space-y-1">
                <div class="flex justify-between items-center">
                  <span class="text-[10px] text-slate-400">수익 금액</span>
                  <span id="result-profit" class="text-sm font-bold">0원</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-[10px] text-slate-400">최종 평가 금액</span>
                  <span id="result-total" class="text-sm font-bold text-emerald-400">0원</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let kospiChartInstance = null;
    let snpChartInstance = null;
    let isAdmin = false;
    let savedPassword = "";
    let localData = [];

    // 기본 가상 데이터 (최초 실행 시 심심하지 않게 예제를 로드해 둡니다)
    const DEFAULT_MOCK_DATA = [
      { id: 1714521600000, date: '2026-05-01', kospi: 2650.12, snp: 5010.25 },
      { id: 1714608000000, date: '2026-05-02', kospi: 2680.45, snp: 5050.10 },
      { id: 1714694400000, date: '2026-05-03', kospi: 2670.30, snp: 5120.44 },
      { id: 1714780800000, date: '2026-05-04', kospi: 2710.88, snp: 5180.20 },
      { id: 1714867200000, date: '2026-05-05', kospi: 2730.15, snp: 5210.60 }
    ];

    window.onload = () => {
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      initStorage();
      loadData();
    };

    // 로컬스토리지 초기 설정
    function initStorage() {
      const stored = localStorage.getItem('sool_stock_data');
      if (stored) {
        localData = JSON.parse(stored);
      } else {
        // 최초 실행 시 기본 데이터 탑재
        localData = DEFAULT_MOCK_DATA;
        localStorage.setItem('sool_stock_data', JSON.stringify(localData));
      }
    }

    // 데이터 저장소 업데이트
    function saveToStorage() {
      localStorage.setItem('sool_stock_data', JSON.stringify(localData));
    }

    // 로그인 체크
    function checkAuth() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === "admin602") {
        isAdmin = true;
        savedPassword = pass;
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-badge').classList.remove('hidden');
        document.getElementById('input-panel').classList.remove('hidden');
        loadData();
        showStatus("학생 관리자 모드로 로그인했습니다!");
      } else {
        showStatus("비밀번호가 틀렸습니다.", true);
      }
    }

    function logout() {
      isAdmin = false;
      savedPassword = "";
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('admin-badge').classList.add('hidden');
      document.getElementById('input-panel').classList.add('hidden');
      document.getElementById('admin-pass').value = "";
      loadData();
      showStatus("로그아웃 되었습니다.");
    }

    // 데이터를 읽어와 그래프와 목록 업데이트
    function loadData() {
      // 날짜순 정렬
      localData.sort((a, b) => new Date(a.date) - new Date(b.date));
      
      renderCharts(localData);
      renderHistory(localData);
    }

    function renderCharts(data) {
      const labels = data.map(d => d.date);
      const kospiValues = data.map(d => d.kospi);
      const snpValues = data.map(d => d.snp);

      const ctxKospi = document.getElementById('kospiChart').getContext('2d');
      if (kospiChartInstance) kospiChartInstance.destroy();
      kospiChartInstance = createChart(ctxKospi, 'KOSPI', labels, kospiValues, '#3b82f6', 'rgba(59, 130, 246, 0.05)');

      const ctxSnp = document.getElementById('snpChart').getContext('2d');
      if (snpChartInstance) snpChartInstance.destroy();
      snpChartInstance = createChart(ctxSnp, 'S&P 500', labels, snpValues, '#ef4444', 'rgba(239, 68, 68, 0.05)');
    }

    function createChart(ctx, label, labels, values, color, bgColor) {
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: values,
            borderColor: color,
            backgroundColor: bgColor,
            borderWidth: 2.5,
            tension: 0.25,
            fill: true,
            pointBackgroundColor: '#fff',
            pointBorderColor: color,
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              padding: 10,
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleFont: { size: 12, weight: 'bold' },
              bodyFont: { size: 12 }
            }
          },
          scales: {
            y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, color: '#64748b' } },
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#64748b' } }
          }
        }
      });
    }

    function renderHistory(data) {
      const container = document.getElementById('history-list');
      if (data.length === 0) {
        container.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">저장된 기록이 없습니다.</div>';
        return;
      }

      container.innerHTML = [...data].reverse().map(item => `
        <div class="p-4 flex justify-between items-center group hover:bg-slate-50 transition">
          <div class="flex-grow">
            <div class="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">${item.date}</div>
            <div class="flex gap-4">
              <div class="text-sm font-semibold cursor-pointer hover:text-blue-500 transition" onclick="fillCalc('${item.kospi}')">
                <span class="text-blue-500 mr-1 font-bold">K</span>${parseFloat(item.kospi).toLocaleString()}
              </div>
              <div class="text-sm font-semibold cursor-pointer hover:text-red-500 transition" onclick="fillCalc('${item.snp}')">
                <span class="text-red-500 mr-1 font-bold">S</span>${parseFloat(item.snp).toLocaleString()}
              </div>
            </div>
          </div>
          ${isAdmin ? `
            <button onclick="deleteItem(${item.id})" class="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition opacity-0 group-hover:opacity-100">
              <i class="fas fa-trash-alt"></i>
            </button>
          ` : ''}
        </div>
      `).join('');
    }

    // 데이터 제출
    function submitData() {
      const date = document.getElementById('input-date').value;
      const kospi = parseFloat(document.getElementById('input-kospi').value);
      const snp = parseFloat(document.getElementById('input-snp').value);

      if (!date || isNaN(kospi) || isNaN(snp)) {
        showStatus("날짜와 두 지수를 모두 입력해주세요.", true);
        return;
      }

      // 이미 해당 날짜의 데이터가 존재하는지 확인
      const existingIdx = localData.findIndex(item => item.date === date);
      if (existingIdx !== -1) {
        if (!confirm(`${date}에 등록된 데이터가 이미 있습니다. 덮어쓰시겠습니까?`)) {
          return;
        }
        localData[existingIdx] = { id: Date.now(), date, kospi, snp };
      } else {
        localData.push({ id: Date.now(), date, kospi, snp });
      }

      saveToStorage();
      loadData();

      // 입력란 비우기
      document.getElementById('input-kospi').value = "";
      document.getElementById('input-snp').value = "";
      showStatus("데이터가 안전하게 저장되었습니다.");
    }

    // 데이터 삭제
    function deleteItem(id) {
      if (!confirm("해당 지수 데이터를 삭제하시겠습니까?")) return;
      localData = localData.filter(item => item.id !== id);
      saveToStorage();
      loadData();
      showStatus("데이터가 삭제되었습니다.");
    }

    // 계산기 자동입력
    function fillCalc(value) {
      const buyField = document.getElementById('calc-buy');
      const sellField = document.getElementById('calc-sell');
      if (!buyField.value) { buyField.value = value; } 
      else { buyField.value = value; } // 새로 누르면 기본적으로 매수에 먼저 들어가도록 구성
      calculateProfit();
    }

    // 수익률 계산기 로직
    function calculateProfit() {
      const amount = parseFloat(document.getElementById('calc-amount').value) || 0;
      const buy = parseFloat(document.getElementById('calc-buy').value) || 0;
      const sell = parseFloat(document.getElementById('calc-sell').value) || 0;
      
      const resultDiv = document.getElementById('calc-result');
      const percentEl = document.getElementById('result-percent');
      const profitEl = document.getElementById('result-profit');
      const totalEl = document.getElementById('result-total');

      if (buy !== 0 && sell !== 0) {
        resultDiv.classList.remove('hidden');
        
        // 수익률 계산
        const profitPercent = ((sell - buy) / buy) * 100;
        percentEl.innerText = (profitPercent >= 0 ? '+' : '') + profitPercent.toFixed(2) + '%';
        percentEl.className = `text-xl font-black ${profitPercent >= 0 ? 'text-emerald-400' : 'text-red-400'}`;

        if (amount > 0) {
          const finalTotal = amount * (sell / buy);
          const netProfit = finalTotal - amount;

          profitEl.innerText = (netProfit >= 0 ? '+' : '') + Math.round(netProfit).toLocaleString() + '원';
          profitEl.className = `text-sm font-bold ${netProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
          
          totalEl.innerText = Math.round(finalTotal).toLocaleString() + '원';
          totalEl.parentElement.classList.remove('hidden');
        } else {
          profitEl.innerText = "투자 원금을 입력하세요";
          profitEl.className = "text-[10px] text-slate-500 font-normal italic";
          totalEl.parentElement.classList.add('hidden');
        }
      } else {
        resultDiv.classList.add('hidden');
      }
    }

    // 데이터 백업 (JSON 다운로드)
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localData, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `sool_stock_data_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
      showStatus("데이터가 JSON 파일로 백업되었습니다.");
    }

    // 데이터 복구 (JSON 가져오기)
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm("정말 이 파일로 로컬 데이터를 대체하시겠습니까? (현재 기기의 데이터가 덮어씌워집니다.)")) {
              localData = imported;
              saveToStorage();
              loadData();
              showStatus("데이터 복구가 성공적으로 완료되었습니다!");
            }
          } else {
            showStatus("올바르지 않은 파일 형식입니다.", true);
          }
        } catch (err) {
          showStatus("파일을 읽는 도중 오류가 발생했습니다.", true);
        }
      };
      reader.readAsText(file);
    }

    function showStatus(msg, isError = false) {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-8 py-4 rounded-2xl shadow-2xl text-white font-bold z-[100] transition-all transform animate-bounce ${isError ? 'bg-red-600' : 'bg-indigo-600'}`;
      toast.innerHTML = (isError ? '<i class="fas fa-exclamation-triangle mr-2"></i>' : '<i class="fas fa-check-circle mr-2"></i>') + msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 500);
      }, 3000);
    }
  </script>
</body>
</html>
